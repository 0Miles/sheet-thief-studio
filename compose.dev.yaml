# Postgres and Redis for development and for the server's tests (docs/spec/testing.md), and the
# recognition service (docs/spec/recognizer.md).
# Start with `docker compose -f compose.dev.yaml up -d`. The host ports are not the default
# ones so that they do not collide with other projects' databases on the same machine.
name: sheet-thief-studio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      # Creates the databases of the server's tests and of the end-to-end tests on first start.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6388:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The recognition service (docs/spec/recognizer.md, section 3): the server reaches it at
  # RECOGNIZER_URL, http://127.0.0.1:8000 by default. Bound to this machine only.
  recognizer:
    build:
      context: ./services/recognizer
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres:
