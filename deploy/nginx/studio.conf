# The standalone mode's nginx (docs/DEPLOYMENT.md): TLS here, everything else to the server that
# compose.standalone.yaml publishes on 127.0.0.1:8031. For the http context, e.g. /etc/nginx/conf.d/.
# Replace studio.example.com and the certificate paths. Needs nginx 1.25.1 or later (`http2 on`).

# The Connection header of a WebSocket upgrade (/collab).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream sheet_thief_studio {
    # STUDIO_PORT in deploy/.env.
    server 127.0.0.1:8031;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name studio.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studio.example.com;

    ssl_certificate     /etc/nginx/certs/studio.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/studio.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sheet_thief_studio_tls:10m;
    ssl_session_timeout 1d;

    # The largest body the server takes, POST /api/recognitions' images:
    # RECOGNITION_BODY_LIMIT in apps/server/src/limits.ts, 40 MB + 64 KB. Every other route's
    # limit is smaller and the server answers it itself (413).
    client_max_body_size 42008576;

    proxy_http_version 1.1;
    # The server takes the client's IP from this header, trusting this nginx only
    # (TRUSTED_PROXIES): replaced, not appended to, so a client cannot put an address in it.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://sheet_thief_studio;
    }

    # Co-editing: Hocuspocus on a WebSocket. A location that sets a header inherits none of the
    # server block's, so all of them again.
    location /collab {
        proxy_pass http://sheet_thief_studio;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A connection stays open as long as its tab does.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # A token in the URL is never logged (docs/spec/security.md, section 9): read-only links
    # carry theirs in the path, a karyl-chan login link in the query. The standalone server
    # answers /auth/karyl with 404, but a link sent here by mistake would still be logged.
    location /s/ {
        access_log off;
        proxy_pass http://sheet_thief_studio;
    }
    location /api/s/ {
        access_log off;
        proxy_pass http://sheet_thief_studio;
    }
    location = /auth/karyl {
        access_log off;
        proxy_pass http://sheet_thief_studio;
    }
}
