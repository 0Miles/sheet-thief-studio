# The plugin mode (docs/DEPLOYMENT.md): only when an nginx stands in front of the karyl-chan bot.
# The studio has no nginx of its own then: the bot proxies /plugin/sheet-thief-studio/ to it. What
# the studio needs of that nginx is in the `location` blocks below; copy them into the bot's
# existing `server` block, and the `map` into the http context if it has none. The rest of this
# file (the upstream, the server block, the certificate paths, bot.example.com) is a stand-in for
# the bot's own settings, here so that the file passes `nginx -t` on its own.
# Needs nginx 1.25.1 or later (`http2 on`).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Stand-in: wherever the bot's web server listens.
upstream karyl_chan_bot {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.example.com;

    ssl_certificate     /etc/nginx/certs/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/bot.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://karyl_chan_bot;
    }

    # ---- sheet-thief-studio: copy from here ----------------------------------------------------

    # The studio's pages and API. The largest body it takes is a recognition's images:
    # RECOGNITION_BODY_LIMIT in apps/server/src/limits.ts, 40 MB + 64 KB.
    location /plugin/sheet-thief-studio/ {
        client_max_body_size 42008576;
        proxy_pass http://karyl_chan_bot;
    }

    # Co-editing on a WebSocket: the bot forwards the upgrade to the studio, so this nginx must
    # too. A location that sets a header inherits none of the server block's: all of them again.
    location /plugin/sheet-thief-studio/collab {
        proxy_pass http://karyl_chan_bot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # A token in the URL is never logged (docs/spec/security.md, section 9): the login link of
    # /studio in the query, read-only links in the path.
    location = /plugin/sheet-thief-studio/auth/karyl {
        access_log off;
        proxy_pass http://karyl_chan_bot;
    }
    location /plugin/sheet-thief-studio/s/ {
        access_log off;
        proxy_pass http://karyl_chan_bot;
    }
    location /plugin/sheet-thief-studio/api/s/ {
        access_log off;
        proxy_pass http://karyl_chan_bot;
    }

    # ---- sheet-thief-studio: to here -----------------------------------------------------------
}
