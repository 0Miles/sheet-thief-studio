name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The server's tests use a real Postgres and Redis, on the ports of compose.dev.yaml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_test
        ports: ["5438:5432"]
        options: --health-cmd "pg_isready -U studio -d studio_test" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6388:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - id: build
        name: Build the web app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @studio/web build
      # Only the end-to-end build may expose window.__studioTest, and only the measurement build
      # window.__studioMeasure: this one, made without VITE_E2E or VITE_MEASURE, holds neither
      # (docs/spec/testing.md, section 2).
      - name: The production build holds no test or measurement hook
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if grep -rq "__studio" apps/web/dist; then
            echo "apps/web/dist holds __studio: a test or measurement hook is in the production build" >&2
            grep -rl "__studio" apps/web/dist >&2
            exit 1
          fi

  # The recognition service, the repository's only Python: its pytest suite in the Docker image that
  # has the OCR packages, where a test marked "ocr" fails instead of skipping when they are missing
  # (docs/spec/recognizer.md, ADR 0006). Then its runtime target, the one Compose will build.
  recognizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker build --target test --tag studio-recognizer-test services/recognizer
      - name: Recognizer tests
        run: docker run --rm studio-recognizer-test
      - name: Build the service image
        run: docker build --tag studio-recognizer services/recognizer

  # The Playwright version pnpm-lock.yaml holds, which names the image the e2e jobs run in.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lockfile.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - id: lockfile
        name: Playwright's version in the lockfile
        run: |
          versions=$(sed -nE "s#^  '@playwright/test@([0-9.]+)':\$#\1#p" pnpm-lock.yaml | sort -u)
          if [ "$(echo "$versions" | wc -w)" != 1 ]; then
            echo "pnpm-lock.yaml must hold exactly one @playwright/test, holds: $versions" >&2
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

  # The pages through a real browser, against the real server, Postgres and Redis: the whole suite
  # in Chromium, smoke tests in Firefox and WebKit (docs/spec/testing.md, section 3). WebKit's
  # Playwright project logs in to a server of its own with the development cookie
  # (INSECURE_COOKIES=1, apps/web/playwright.config.ts); Chromium and Firefox keep `__Host-`.
  #
  # The jobs run in Playwright's image of the lockfile's version, which holds the browsers and the
  # system libraries they need: nothing comes from an Ubuntu mirror, whose slow hours used to eat
  # the job's whole time budget installing them (#145). User 1001 is the runner's, which owns the
  # workspace; Firefox refuses to run as root under GitHub's HOME. In a container job the services
  # are reached by their names on their own ports, not through localhost (e2e/environment.ts).
  e2e:
    name: ${{ matrix.name }}
    needs: playwright-version
    runs-on: ubuntu-latest
    # The image pull and setup take a minute or two, the whole Chromium suite over 7 minutes and growing.
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host
    env:
      E2E_DATABASE_URL: postgres://studio:studio@postgres:5432/studio_e2e
      E2E_REDIS_URL: redis://redis:6379/2
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: e2e, browser: chromium, projects: --project=chromium --project=served --project=plugin }
          - { name: e2e-firefox, browser: firefox, projects: --project=firefox }
          - { name: e2e-webkit, browser: webkit, projects: --project=webkit }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_e2e
        options: --health-cmd "pg_isready -U studio -d studio_e2e" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      # The image already holds every browser of its version (PLAYWRIGHT_BROWSERS_PATH=/ms-playwright),
      # so this finds the browser and downloads nothing; it fails here, within its own budget,
      # rather than in the tests if the image ever lacks it.
      - name: Install ${{ matrix.browser }}
        timeout-minutes: 3
        run: pnpm --filter @studio/web exec playwright install ${{ matrix.browser }}
      - name: End-to-end tests
        timeout-minutes: 20
        run: pnpm --filter @studio/web test:e2e ${{ matrix.projects }}
      - name: Keep the Playwright report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7
