name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The server's tests use a real Postgres and Redis, on the ports of compose.dev.yaml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_test
        ports: ["5438:5432"]
        options: --health-cmd "pg_isready -U studio -d studio_test" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6388:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - id: build
        name: Build the web app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @studio/web build
      # Only the end-to-end build may expose window.__studioTest (docs/spec/testing.md, section 2).
      - name: The production build holds no test hook
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if grep -rq "__studioTest" apps/web/dist; then
            echo "apps/web/dist holds __studioTest: the test hook is in the production build" >&2
            exit 1
          fi

  # The pages through a real browser, against the real server, Postgres and Redis.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_e2e
        ports: ["5438:5432"]
        options: --health-cmd "pg_isready -U studio -d studio_e2e" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6388:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @studio/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @studio/web test:e2e
      - name: Keep the Playwright report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
