name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The server's tests use a real Postgres and Redis, on the ports of compose.dev.yaml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_test
        ports: ["5438:5432"]
        options: --health-cmd "pg_isready -U studio -d studio_test" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6388:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - id: build
        name: Build the web app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @studio/web build
      # Only the end-to-end build may expose window.__studioTest, and only the measurement build
      # window.__studioMeasure: this one, made without VITE_E2E or VITE_MEASURE, holds neither
      # (docs/spec/testing.md, section 2).
      - name: The production build holds no test or measurement hook
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if grep -rq "__studio" apps/web/dist; then
            echo "apps/web/dist holds __studio: a test or measurement hook is in the production build" >&2
            grep -rl "__studio" apps/web/dist >&2
            exit 1
          fi

  # The pages through a real browser, against the real server, Postgres and Redis: the whole suite
  # in Chromium, smoke tests in Firefox and WebKit (docs/spec/testing.md, section 3). WebKit's
  # Playwright project logs in to a server of its own with the development cookie
  # (INSECURE_COOKIES=1, apps/web/playwright.config.ts); Chromium and Firefox keep `__Host-`.
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: e2e, browser: chromium, projects: --project=chromium --project=served }
          - { name: e2e-firefox, browser: firefox, projects: --project=firefox }
          - { name: e2e-webkit, browser: webkit, projects: --project=webkit }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_e2e
        ports: ["5438:5432"]
        options: --health-cmd "pg_isready -U studio -d studio_e2e" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6388:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        name: Playwright's version
        run: echo "version=$(pnpm --filter @studio/web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # Only the browser of this job, kept between runs of the same Playwright version; the
      # system libraries it needs are installed each time (--with-deps), the browser only if missing.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @studio/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end tests
        run: pnpm --filter @studio/web test:e2e ${{ matrix.projects }}
      - name: Keep the Playwright report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7
